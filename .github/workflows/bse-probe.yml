name: BSE API probe (temporary)
on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Optional endpoint URL to test directly"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover
        env:
          EP: ${{ github.event.inputs.endpoint }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          H1="Referer: https://www.bseindia.com/"
          {
            if [ -n "$EP" ]; then
              echo "## direct endpoint test"
              echo '```'
              curl -s -m 40 -A "$UA" -H "$H1" -H "Accept: application/json" "$EP" | head -c 3000
              echo; echo '```'
            else
              echo "## script bundles on trade_repository page"
              PAGE=$(curl -s -m 40 -A "$UA" "https://www.bseindia.com/markets/debt/trade_repository")
              echo '```'
              echo "$PAGE" | grep -oE 'src="[^"]+\.js[^"]*"' | head -25
              echo '```'
              echo "## api URLs inside bundles (filtered trade/debt/repo/tr)"
              for SRC in $(echo "$PAGE" | grep -oE 'src="[^"]+\.js[^"]*"' | cut -d'"' -f2 | head -12); do
                case "$SRC" in http*) URL="$SRC";; /*) URL="https://www.bseindia.com$SRC";; *) URL="https://www.bseindia.com/markets/debt/$SRC";; esac
                echo "### $URL"
                echo '```'
                curl -s -m 40 -A "$UA" "$URL" | grep -oE '(https://api\.bseindia\.com)?/?BseIndiaAPI/api/[A-Za-z0-9_]+/w[^"'\'' ]*' | sort -u | head -50
                echo '```'
              done
              echo "## any api.bseindia.com refs"
              for SRC in $(echo "$PAGE" | grep -oE 'src="[^"]+\.js[^"]*"' | cut -d'"' -f2 | head -12); do
                case "$SRC" in http*) URL="$SRC";; /*) URL="https://www.bseindia.com$SRC";; *) URL="https://www.bseindia.com/markets/debt/$SRC";; esac
                curl -s -m 40 -A "$UA" "$URL" | grep -oE 'api\.bseindia\.com[^"'\'' ]{0,120}' | sort -u | head -30
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
