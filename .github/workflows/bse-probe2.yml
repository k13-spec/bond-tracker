name: BSE API probe 2 (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hunt route chunks
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          BASE="https://www.bseindia.com/assets/includenew/js"
          curl -s -m 40 -A "$UA" "$BASE/main-SDCU5NAX.js" -o main.js
          curl -s -m 40 -A "$UA" "https://www.bseindia.com/markets/debt/env.js" -o env.js
          {
            echo "## env.js"
            echo '```'
            head -c 1500 env.js
            echo; echo '```'
            echo "## chunk candidates in main.js"
            grep -oE 'chunk-[A-Z0-9]+\.js' main.js | sort -u > chunks.txt || true
            echo "count: $(wc -l < chunks.txt)"
            echo "## chunks mentioning trade/debt/repo/Yeild/Exhange"
            i=0
            while read -r C; do
              i=$((i+1)); [ $i -gt 80 ] && break
              curl -s -m 30 -A "$UA" "$BASE/$C" -o chunk.js || continue
              if grep -qiE 'Yeild|Exhange|trade_?repo|TradeRep|DebtTrade|WAY' chunk.js; then
                echo "### MATCH: $C"
                echo '```'
                grep -oE 'BseIndiaAPI/api/[A-Za-z0-9_]+/w[^"'\''`]*' chunk.js | sort -u | head -20
                echo "--- context ---"
                grep -oE '.{60}(Yeild|Exhange|WAY).{60}' chunk.js | head -6
                echo '```'
              fi
            done < chunks.txt
          } >> "$GITHUB_STEP_SUMMARY"
