name: BSE API probe 5 (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SecondaryMarket params and live tests
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -s -m 40 -A "$UA" "https://www.bseindia.com/assets/includenew/js/main-SDCU5NAX.js" -o main.js
          {
            echo "## context around SecondaryMarket (params!)"
            echo '```'
            grep -oE '.{250}SecondaryMarket.{350}' main.js | head -8
            echo '```'
            echo "## context around CTRSecond / CTR"
            echo '```'
            grep -oE '.{150}CTR[A-Za-z]*.{250}' main.js | head -6
            echo '```'
            echo "## live tests"
            for EP in \
              "https://api.bseindia.com/BseIndiaAPI/api/Mkt_Debt_Trade_SecondaryMarket_beta/w?fmdt=01/07/2026&todt=07/07/2026" \
              "https://api.bseindia.com/BseIndiaAPI/api/Mkt_Debt_Trade_SecondaryMarket_beta/w?fmdt=01%2F07%2F2026&todt=07%2F07%2F2026&flag=0&isin=" \
              "https://api.bseindia.com/BseIndiaAPI/api/Mkt_Debt_Trade_SecondaryMarket_DownloadCSV_beta/w?fmdt=01/07/2026&todt=07/07/2026" ; do
              echo "### $EP"
              echo '```'
              curl -s -m 40 -A "$UA" -H "Referer: https://www.bseindia.com/" -H "Accept: application/json" "$EP" | head -c 1500
              echo; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
