# Quarterly investor-category holdings refresh (+ on-demand backfill).
#
# NSDL publishes a per-ISIN quarterly "Statement showing pattern of
# Debenture/Bond Holders" (units held by investor category). fetch_holdings.py
# pulls the LATEST quarter for every covered bond — yield-covered ISINs plus
# all active non-PSU Corporate/Infrastructure NCDs (~8.5k total; classification
# mirrors the app) — and writes data/holdings_mix.csv ("Holders Mix" column).
#
# Quarterly statements land ~3 weeks after quarter-end, so the cron runs on
# the 25th of Jan/Apr/Jul/Oct. Each run is best-effort: ISINs that fail keep
# their previous quarter's row.
#
# Manual dispatch supports a BACKFILL mode: set backfill_batches > 0 to fetch
# only not-yet-covered ISINs in batches of 800, committing and pushing after
# every batch so an interrupted run loses nothing. Used for the 2026-08 scope
# expansion; harmless to re-run (exits early when nothing is left).

name: Holdings mix quarterly refresh

on:
  schedule:
    - cron: "30 4 25 1,4,7,10 *"   # 10:00 IST, 25th of Jan/Apr/Jul/Oct
  workflow_dispatch:
    inputs:
      backfill_batches:
        description: "Backfill N batches of 800 new-only ISINs (0 = full refresh)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: holdings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Backfill in batches
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_batches != '0' && github.event.inputs.backfill_batches != ''
        run: |
          set -o pipefail
          for i in $(seq 1 "${{ github.event.inputs.backfill_batches }}"); do
            echo "=== batch $i ==="
            rc=0
            python fetch_holdings.py --new-only 800 2>&1 | tee holdings_log.txt || rc=$?
            if [ "$rc" = "3" ]; then
              echo "Backfill complete — nothing left."
              break
            elif [ "$rc" != "0" ]; then
              echo "Batch $i failed (rc=$rc) — stopping, prior batches are committed."
              exit "$rc"
            fi
            git add data/holdings_mix.csv
            if git diff --cached --quiet; then
              echo "Batch $i produced no changes."
              continue
            fi
            N=$(grep -oP 'wrote .*: \K\d+' holdings_log.txt || echo "?")
            git commit -m "Holdings mix backfill batch $i (${N} ISINs total)"
            git pull --rebase origin main
            git push
          done

      - name: Full refresh
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.backfill_batches == '0' || github.event.inputs.backfill_batches == ''
        run: |
          set -o pipefail
          python fetch_holdings.py 2>&1 | tee holdings_log.txt
          git add data/holdings_mix.csv
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          N=$(grep -oP 'wrote .*: \K\d+' holdings_log.txt || echo "?")
          git commit -m "Auto-refresh holdings mix (${N} ISINs)"
          git pull --rebase origin main
          git push

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Holdings mix refresh"
            echo '```'
            tail -5 holdings_log.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
